name: Test and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked --extra dev
      - run: uv run --frozen pytest
      - run: uv build
      - name: Test installed wheel outside checkout
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/modelome-smoke"
          uv pip install --python "$RUNNER_TEMP/modelome-smoke/bin/python" dist/*.whl
          cp examples/papers.jsonl "$RUNNER_TEMP/papers.jsonl"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/modelome-smoke/bin/modelome" --version
          "$RUNNER_TEMP/modelome-smoke/bin/modelome" --json sources > sources.json
          "$RUNNER_TEMP/modelome-smoke/bin/modelome" --store store build-dataset \
            --input papers.jsonl --output dataset
          test -s dataset/entries/entries.jsonl
