[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "modelome"
version = "0.1.0"
description = "An evidence-backed, continuously updated registry of deep-learning models"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Modelome contributors" }]
dependencies = [
  "pyarrow>=20.0",
]

[project.urls]
Repository = "https://github.com/modelomics/modelome"
Issues = "https://github.com/modelomics/modelome/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]
aws = [
  "boto3>=1.35",
]

[project.scripts]
modelome = "modelome.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modelome"]

[tool.hatch.build.targets.wheel.force-include]
"config/sources.toml" = "modelome/resources/sources.toml"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
