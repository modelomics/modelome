# PWC's paper-to-code archive is a complete, versioned public snapshot. This source
# retains only PWC rows explicitly marked official, creates both paper and repository
# artifacts, and persists direct edge evidence without crawling either endpoint.
# The separate PWC methods dump is intentionally not an ingestion source: it requires
# independent validation before it can assert model identity.
[[source]]
name = "paperswithcode-links"
adapter = "paperswithcode_links"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:paperswithcode"]
dataset_id = "pwc-archive/links-between-paper-and-code"
metadata_url = "https://huggingface.co/api/datasets/pwc-archive/links-between-paper-and-code"
data_path = "data/train-00000-of-00001.parquet"
license = "CC-BY-SA-4.0"
schedule = "weekly"
page_size = 10000
max_dataset_bytes = 67108864

# The raw PWC methods dump is not ingested. This separate source admits only rows
# whose source-paper linkage survives generic corruption checks and independent
# arXiv title verification; they remain documented identities, not release claims.
[[source]]
name = "paperswithcode-methods-validated"
adapter = "paperswithcode_methods_validated"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:paperswithcode"]
dataset_id = "pwc-archive/methods"
metadata_url = "https://huggingface.co/api/datasets/pwc-archive/methods"
data_path = "data/train-00000-of-00001.parquet"
license = "CC-BY-SA-4.0"
arxiv_api_url = "https://export.arxiv.org/api/query"
arxiv_batch_size = 100
arxiv_delay_seconds = 3
schedule = "weekly"
max_dataset_bytes = 16777216

# A broader discovery tier preserves structurally valid, non-spam, arXiv-linked
# method records as candidates. Candidate status keeps these distinct from the
# stricter arXiv-title-verified documented subset above.
[[source]]
name = "paperswithcode-method-candidates"
adapter = "paperswithcode_methods_validated"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:paperswithcode"]
dataset_id = "pwc-archive/methods"
metadata_url = "https://huggingface.co/api/datasets/pwc-archive/methods"
data_path = "data/train-00000-of-00001.parquet"
license = "CC-BY-SA-4.0"
admission = "candidate"
schedule = "weekly"
max_dataset_bytes = 16777216

# A broader candidate tier retains the same structurally valid, phone-free PWC
# method rows whenever they have both a declared PWC paper and a source-paper URL,
# even when that paper is not hosted by arXiv. It is intentionally lower confidence
# than the arXiv-linked tier and never makes a documented/release assertion.
[[source]]
name = "paperswithcode-method-paper-candidates"
adapter = "paperswithcode_methods_validated"
