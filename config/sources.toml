# This catalog contains ingestion and evaluation mechanics, never model names.
# Add another corpus by adding a source block; discovery code does not need to change.
# Benchmarks measure discovery coverage and are never loaded by normal syncs.

[[benchmark]]
name = "epoch"
adapter = "csv"
url = "https://epoch.ai/data/all_ai_models.csv"
schedule = "daily"

[benchmark.mapping]
model_field = "Model"

[[source]]
name = "huggingface"
adapter = "huggingface"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:huggingface"]
url = "https://huggingface.co/api/models"
artifact_kind = "model_card"
schedule = "daily"
page_size = 100
overlap_days = 1
created_at_sweep_interval_days = 30
max_response_bytes = 16777216

# Kaggle Models is a separate public model-and-variation registry. The adapter
# follows the provider's opaque model-list page token, retains each published
# variation/version and public download reference, and never downloads it.
[[source]]
name = "kaggle-models"
adapter = "kaggle_models"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:kaggle"]
url = "https://www.kaggle.com/api/v1/models/list"
artifact_kind = "model_card"
schedule = "weekly"
page_size = 100
sort_by = "createTime"
include_all_versions = true
# Opt in to per-version file metadata when the additional API cost is acceptable.
include_version_files = false

# CivitAI is an independent public catalog for generative-model checkpoints and
# derivatives. The adapter follows its opaque newest-first cursor, retains all
# published version/file metadata and references download URLs without fetching bytes.
[[source]]
name = "civitai-models"
adapter = "civitai_models"
enabled = true
entry_tags = ["field:generative-image-modeling", "ecosystem:civitai"]
url = "https://civitai.com/api/v1/models"
artifact_kind = "model_card"
schedule = "weekly"
page_size = 100
sort_by = "Newest"
include_nsfw = true

# OpenCSG Hub's public API offers a separately maintained repository catalog.
# It yields source-native repository paths and declared Hugging Face/ModelScope
# mirror paths; clone URLs remain references and are never cloned by this adapter.
[[source]]
name = "opencsg-models"
adapter = "opencsg_models"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:opencsg"]
url = "https://hub.opencsg.com/api/v1/models"
artifact_kind = "model_card"
schedule = "weekly"
page_size = 100
sort_by = "recently_update"

# ModelScope publishes a large independent model hub through its anonymous
# OpenAPI, but enforces a 3,000-row deep-pagination ceiling per sort. Capture
# the four documented first-party sort windows precisely and record this as a
# bounded discovery plane, never as a complete provider snapshot.
[[source]]
name = "modelscope-models"
adapter = "modelscope_models"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:modelscope", "kind:model-hub"]
url = "https://modelscope.cn/openapi/v1/models"
schedule = "daily"
page_size = 50
max_pages_per_sort = 60
sorts = ["default", "downloads", "likes", "last_modified"]
max_response_bytes = 4194304

# NGC publishes a guest-readable public MODEL search group. The ordered query
# streams its current rows without a name filter. It is a moving, paginated
# provider listing rather than a versioned export, so a completed sweep never
# uses source-wide deletion semantics; per-card enrichment remains a later
# bounded frontier step.
[[source]]
name = "ngc-models"
adapter = "ngc_models"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:nvidia-ngc", "kind:model-catalog"]
url = "https://api.ngc.nvidia.com/v2/search/catalog/resources/MODEL"
model_page_base_url = "https://catalog.ngc.nvidia.com"
metadata_base_url = "https://api.ngc.nvidia.com"
schedule = "daily"
page_size = 200
max_response_bytes = 4194304

