name = "gluonts-forecasting-techniques"
adapter = "html_catalog"
enabled = true
entry_tags = ["field:time-series-machine-learning", "ecosystem:gluonts", "kind:machine-learning-component", "task:forecasting"]
url = "https://ts.gluon.ai/stable/getting_started/models.html"
provider_namespace = "gluonts:machine-learning-component"
artifact_kind = "catalog_record"
model_status = "documented"
allowed_origins = ["https://ts.gluon.ai", "https://doi.org", "https://papers.nips.cc", "https://proceedings.mlr.press", "https://proceedings.neurips.cc", "https://arxiv.org", "https://journals.plos.org", "https://www.jstatsoft.org", "https://otexts.com", "https://www.wiley.com", "https://github.com"]
schedule = "weekly"
max_response_bytes = 8388608
max_entries = 5000

[[source.rules]]
kind = "table"
header_pattern = '^Model \+ Paper \| Local/global \| Data layout \| Architecture/method \| Implementation$'
name_column = 0
link_column = 1
name_source = "before_first_anchor"
identity_source = "name"
require_url = false
row_link_rules = [
  { href_pattern = '^https?://(?:doi\.org|papers\.nips\.cc|proceedings\.(?:mlr\.press|neurips\.cc)|arxiv\.org|journals\.plos\.org|www\.jstatsoft\.org|otexts\.com|www\.wiley\.com)/', relation = "paper_reference" },
  { href_pattern = '^https://github\.com/awslabs/gluonts/(?:blob|tree)/', relation = "official_implementation" },
]

