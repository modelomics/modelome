kind = "link"
href_pattern = '^https://lightgbm\.readthedocs\.io/en/stable/pythonapi/lightgbm\.LGBM(?:Classifier|Regressor|Ranker)\.html$'
identity_source = "url"
identity_pattern = 'lightgbm\.(?P<id>LGBM(?:Classifier|Regressor|Ranker))\.html$'
relation = "model_page"
require_url = true

[[source]]
name = "imbalanced-learn-over-sampling"
adapter = "html_catalog"
enabled = true
entry_tags = ["ecosystem:imbalanced-learn", "kind:machine-learning-component"]
url = "https://imbalanced-learn.org/stable/references/over_sampling.html"
provider_namespace = "imbalanced-learn:technique"
artifact_kind = "catalog_record"
model_status = "documented"
schedule = "weekly"
max_response_bytes = 8388608
max_entries = 5000

[[source.rules]]
kind = "link"
href_pattern = '^https://imbalanced-learn\.org/stable/references/generated/imblearn\.over_sampling\.[A-Za-z0-9_]+\.html$'
identity_source = "url"
identity_pattern = 'imblearn\.over_sampling\.(?P<id>[A-Za-z0-9_]+)\.html$'
relation = "model_page"
require_url = true

# OpenAI's public All models documentation lists direct detail pages for both
# current and deprecated API models. Its path segment is the exact API model ID,
# so this source uses the same exact namespace as the optional account-scoped
# public-owner API source without querying an account. A bounded detail resolver
# can later read source-declared snapshot releases one model page at a time.
[[source]]
name = "openai-model-documentation"
adapter = "html_catalog"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:openai", "kind:model-documentation"]
url = "https://developers.openai.com/api/docs/models/all"
provider_namespace = "openai:model"
artifact_kind = "model_card"
model_status = "documented"
schedule = "daily"
max_response_bytes = 4194304
max_entries = 2000

[[source.rules]]
kind = "link"
href_pattern = '^https://developers\.openai\.com/api/docs/models/(?!all$|compare$)[a-z0-9][a-z0-9.-]*$'
identity_source = "url"
identity_pattern = '^https://developers\.openai\.com/api/docs/models/(?P<id>[a-z0-9][a-z0-9.-]*)$'
name_source = "identity"
relation = "model_documentation"
require_url = true

# Mistral's public All models documentation structurally links its current,
# deprecated, and retired model-detail pages. It is deliberately preferred to
# the account-scoped API list, which can include user fine-tunes. Its exact
# model-page worklist is resolved in small checkpointed batches for only the
# source-declared paper and Mistral Hugging Face card selectors below.
[[source]]
name = "mistral-model-documentation"
adapter = "html_catalog"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:mistral", "kind:model-documentation"]
url = "https://docs.mistral.ai/models"
provider_namespace = "mistral:model-documentation"
artifact_kind = "model_card"
model_status = "documented"
allowed_origins = ["https://docs.mistral.ai", "https://arxiv.org", "https://huggingface.co"]
schedule = "daily"
max_response_bytes = 4194304
max_entries = 1000
detail_batch_size = 10

[[source.rules]]
kind = "link"
href_pattern = '^https://docs\.mistral\.ai/models/[a-z0-9][a-z0-9.-]*$'
identity_source = "url"
identity_pattern = '^https://docs\.mistral\.ai/models/(?P<id>[a-z0-9][a-z0-9.-]*)$'
name_source = "identity"
relation = "model_documentation"
require_url = true

# The index itself names each model page, while a page can directly name the
# corresponding paper and an exact Mistral Hugging Face card. These selectors
# intentionally omit generic organization/social/navigation links.
[[source.detail_resource_rules]]
href_pattern = '^https://arxiv\.org/(?:abs|pdf)/[0-9]{4}\.[0-9]{4,5}(?:v[0-9]+)?(?:\.pdf)?$'
relation = "paper_reference"

[[source.detail_resource_rules]]
href_pattern = '^https://huggingface\.co/mistralai/[A-Za-z0-9._-]+$'
relation = "model_card"

# Cohere's public model overview declares exact API names in structural model
# tables, including live, deprecated, and retired offerings. This public page is
# intentionally used instead of the authenticated list endpoint because that
# endpoint may include a caller's fine-tuned models.
[[source]]
name = "cohere-model-documentation"
adapter = "html_catalog"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:cohere", "kind:model-documentation"]
url = "https://docs.cohere.com/docs/models"
provider_namespace = "cohere:model-documentation"
artifact_kind = "model_card"
model_status = "documented"
schedule = "daily"
max_response_bytes = 4194304
max_entries = 1000

[[source.rules]]
kind = "table"
header_pattern = '^Model Name \| (?:Status \| )?Description \|'
name_column = 0
identity_source = "name"
require_url = false

# Bedrock publishes a first-party card for every model displayed in its public
