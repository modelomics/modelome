schedule = "weekly"
max_dataset_bytes = 83886080
max_model_rows_per_shard = 200000

# Wikidata supplies a compact CC0 identity plane independent of checkpoint hubs
# and paper indexes. This query is deliberately limited to the narrower class
# "machine learning model" rather than the noisier general neural-network tree.
[[source]]
name = "wikidata-ml-models"
adapter = "json_catalog"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:wikidata"]
url = "https://query.wikidata.org/sparql?format=json&query=SELECT+%3Fid+%3Fname+%3Fdescription+WHERE+%7B%0A++%3Fitem+wdt%3AP31%2Fwdt%3AP279%2A+wd%3AQ115215420+.%0A++BIND%28REPLACE%28STR%28%3Fitem%29%2C+%22http%3A%2F%2Fwww.wikidata.org%2Fentity%2F%22%2C+%22%22%29+AS+%3Fid%29%0A++%3Fitem+rdfs%3Alabel+%3Fname+.+FILTER%28LANG%28%3Fname%29+%3D+%22en%22%29%0A++OPTIONAL+%7B+%3Fitem+schema%3Adescription+%3Fdescription+.+FILTER%28LANG%28%3Fdescription%29+%3D+%22en%22%29+%7D%0A%7D+LIMIT+1000"
provider_namespace = "wikidata:entity"
model_card_url_template = "https://www.wikidata.org/wiki/{id}"
model_status = "documented"
schedule = "weekly"

[source.mapping]
items_path = "results.bindings"
id_path = "id.value"
name_path = "name.value"

# Wikimedia's architecture category is an independent, freely reusable discovery
# plane. Its members document named architectures and model families, but are not
# provider release declarations. Pagination stays within the public MediaWiki API.
[[source]]
name = "wikipedia-neural-network-architectures"
adapter = "json_catalog"
enabled = true
entry_tags = ["field:neural-networks", "ecosystem:wikipedia"]
url = "https://en.wikipedia.org/w/api.php?action=query&format=json&list=categorymembers&cmtitle=Category%3ANeural_network_architectures&cmtype=page"
provider_namespace = "wikipedia:page"
model_card_url_template = "https://en.wikipedia.org/wiki/{name}"
model_status = "documented"
schedule = "weekly"
page_size = 500
page_size_param = "cmlimit"
cursor_param = "cmcontinue"

[source.mapping]
items_path = "query.categorymembers"
id_path = "pageid"
name_path = "title"
next_cursor_path = "continue.cmcontinue"

