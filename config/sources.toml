# Scikit-learn publishes its current public API as one first-party index. Retain every
# documented learning component under the major estimator and transformation modules:
# the exact fully-qualified API path is the source-native identity. This is deliberately
# an API/technique plane, not a claim that each component is a trained release or has
# source-declared weights, a paper, or an individual upstream repository.
[[source]]
name = "scikit-learn-machine-learning-components"
adapter = "html_catalog"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:scikit-learn", "kind:machine-learning-component"]
url = "https://scikit-learn.org/stable/api/index.html"
provider_namespace = "scikit-learn:machine-learning-component"
artifact_kind = "catalog_record"
model_status = "documented"
schedule = "weekly"
max_response_bytes = 8388608
max_entries = 5000

[[source.rules]]
kind = "link"
href_pattern = '^https://scikit-learn\.org/stable/modules/generated/sklearn\.(?:calibration|cluster|compose|covariance|cross_decomposition|decomposition|discriminant_analysis|dummy|ensemble|feature_extraction|feature_selection|frozen|gaussian_process|impute|isotonic|kernel_approximation|kernel_ridge|linear_model|manifold|mixture|multiclass|multioutput|naive_bayes|neighbors|neural_network|pipeline|preprocessing|random_projection|semi_supervised|svm|tree)(?:\.[a-z_][A-Za-z0-9_]*)*\.[A-Z][A-Za-z0-9_]*\.html$'
identity_source = "url"
identity_pattern = '/modules/generated/(?P<id>sklearn\.(?:calibration|cluster|compose|covariance|cross_decomposition|decomposition|discriminant_analysis|dummy|ensemble|feature_extraction|feature_selection|frozen|gaussian_process|impute|isotonic|kernel_approximation|kernel_ridge|linear_model|manifold|mixture|multiclass|multioutput|naive_bayes|neighbors|neural_network|pipeline|preprocessing|random_projection|semi_supervised|svm|tree)(?:\.[a-z_][A-Za-z0-9_]*)*\.[A-Z][A-Za-z0-9_]*)\.html$'
require_url = true

