# Ollama's first-party library serves its model-family cards in a single public
# document. This source extracts only each list-card's canonical title/URL pair;
# it references model cards without fetching their manifests or blob layers.
[[source]]
name = "ollama-library"
adapter = "html_catalog"
enabled = true
entry_tags = ["field:language-modeling", "ecosystem:ollama", "kind:model-library"]
url = "https://ollama.com/library"
provider_namespace = "ollama:model-family"
artifact_kind = "model_card"
model_status = "released"
schedule = "daily"
max_response_bytes = 2097152
max_entries = 10000

[[source.rules]]
kind = "text"
entry_pattern = '(?s)<li[^>]*>.*?<a(?=[^>]*href="/library/(?P<id>[a-z0-9][a-z0-9_.-]*)")[^>]*>.*?<div(?=[^>]*title="(?P<name>[^"]+)")[^>]*>'
url_template = "https://ollama.com/library/{id}"
require_url = true

# Cloudflare renders its entire current Workers AI catalog in one first-party
# documentation page. The model-runtime ID, concise display label, and detail URL
# are declared together on each catalog card; no detail pages or model artifacts
# are fetched. This is current availability evidence, not a historical census.
[[source]]
name = "cloudflare-workers-ai"
adapter = "html_catalog"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:cloudflare-workers-ai", "kind:hosted-model"]
url = "https://developers.cloudflare.com/workers-ai/models/"
provider_namespace = "cloudflare-workers-ai:model"
artifact_kind = "model_card"
schedule = "daily"
max_response_bytes = 1048576
max_entries = 1000

[[source.rules]]
kind = "text"
entry_pattern = '(?s)<div(?=[^>]*\bdata-models-cell\b)(?=[^>]*\bdata-model-id="(?P<id>@cf/[A-Za-z0-9_./:-]+)")(?=[^>]*\bdata-model-label="(?P<name>[^"]+)")(?=[^>]*\bdata-model-href="(?P<url>/workers-ai/models/[A-Za-z0-9_.:-]+/)")[^>]*>'
require_url = true

# Zenodo exposes an exact, public Model resource-type query with record/concept
# IDs, DOIs, related-resource declarations, and per-file checksums. Its category
# is cross-domain (including non-ML models), so it is an evidence source whose
# normal candidate extractor must independently establish neural-model scope.
[[source]]
name = "zenodo-model-records"
adapter = "zenodo_model_records"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:zenodo", "kind:research-model-candidate"]
url = "https://zenodo.org/api/records"
query = "resource_type.type:model"
sort = "oldest"
page_size = 25
schedule = "weekly"
max_response_bytes = 16777216

# OpenRouter is a public current-availability plane for hosted models, including
# commercial models that have no downloadable artifact. The unfiltered endpoint
# reports its total and the adapter rejects partial pagination.
[[source]]
name = "openrouter-models"
adapter = "openrouter_models"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:openrouter", "kind:hosted-model"]
url = "https://openrouter.ai/api/v1/models"
model_page_base_url = "https://openrouter.ai"
output_modalities = "all"
schedule = "daily"
max_response_bytes = 16777216

# Replicate's documented public model list requires an API token and intentionally
# includes only its "displayworthy" public models. It remains token-gated so an
# ordinary run cannot accidentally use an account credential or enumerate private data.
[[source]]
name = "replicate-models"
adapter = "replicate_models"
enabled = true
activation_env = "REPLICATE_API_TOKEN"
entry_tags = ["field:machine-learning", "ecosystem:replicate", "kind:hosted-model"]
url = "https://api.replicate.com/v1/models"
model_page_base_url = "https://replicate.com"
token_env = "REPLICATE_API_TOKEN"
schedule = "daily"
max_response_bytes = 16777216

# The documented Models API is account-scoped and can expose a user's private
# fine-tunes. Enable this source only with the operator's own API key and retain
# public-owner rows only. It is availability evidence, never a public historic
# export and never a request to fetch weights or model artifacts.
[[source]]
name = "openai-models"
adapter = "openai_models"
enabled = true
activation_env = "OPENAI_API_KEY"
token_env = "OPENAI_API_KEY"
entry_tags = ["field:machine-learning", "ecosystem:openai", "kind:hosted-model"]
url = "https://api.openai.com/v1/models"
public_owners = ["openai", "system"]
schedule = "daily"
max_response_bytes = 4194304
max_models = 10000

# Anthropic's documented Models API exposes provider-available Claude model IDs,
# display names, release timestamps, capabilities, and an explicit `has_more` /
# `last_id` pagination contract. The generic JSON adapter carries only the
# required public API-version header; the API key stays in its dedicated header
# and is never retained in source state or evidence.
[[source]]
name = "anthropic-models"
adapter = "json_catalog"
enabled = true
activation_env = "ANTHROPIC_API_KEY"
entry_tags = ["field:machine-learning", "ecosystem:anthropic", "kind:hosted-model"]
url = "https://api.anthropic.com/v1/models"
provider_namespace = "anthropic:model"
model_card_url_template = "https://api.anthropic.com/v1/models/{id}"
model_page_crawl = false
auth_env = "ANTHROPIC_API_KEY"
auth_header = "x-api-key"
auth_scheme = ""
cursor_param = "after_id"
page_size_param = "limit"
page_size = 1000
schedule = "daily"

[source.headers]
anthropic-version = "2023-06-01"

[source.mapping]
items_path = "data"
id_path = "id"
name_path = "display_name"
created_path = "created_at"
next_cursor_path = "last_id"
next_cursor_condition_path = "has_more"

# Gemini's documented list endpoint returns its fully qualified resource names,
# stable display/version/capability metadata, and an opaque page token. The API
# key stays in the request query only; it is not embedded in source URLs, state,
# raw evidence, or per-model links. These are API-availability observations, not
# evidence that a deployment name has a paper, code, or downloadable weights.
[[source]]
name = "google-gemini-models"
adapter = "json_catalog"
enabled = true
activation_env = "GEMINI_API_KEY"
entry_tags = ["field:machine-learning", "ecosystem:google-gemini", "kind:hosted-model"]
url = "https://generativelanguage.googleapis.com/v1beta/models"
provider_namespace = "google:gemini-api-model"
model_card_url_template = "https://generativelanguage.googleapis.com/v1beta/{id_path}"
model_page_crawl = false
auth_env = "GEMINI_API_KEY"
auth_query_param = "key"
cursor_param = "pageToken"
page_size_param = "pageSize"
page_size = 1000
schedule = "daily"
max_response_bytes = 4194304

[source.mapping]
items_path = "models"
id_path = "name"
name_path = "displayName"
base_model_path = "baseModelId"
next_cursor_path = "nextPageToken"

# Groq documents this endpoint as the list of all active hosted models. It is a
# current serving-availability plane with provider IDs, ownership and timestamp
# metadata—not a claim that the hosted model is Groq-owned or downloadable.
# Its key is held only in the Authorization header and every item resource stays
# reference-only because it is credentialed.
[[source]]
name = "groq-models"
adapter = "json_catalog"
enabled = true
activation_env = "GROQ_API_KEY"
entry_tags = ["field:machine-learning", "ecosystem:groq", "kind:hosted-model"]
url = "https://api.groq.com/openai/v1/models"
provider_namespace = "groq:model"
model_card_url_template = "https://api.groq.com/openai/v1/models/{id_path}"
model_page_crawl = false
auth_env = "GROQ_API_KEY"
auth_header = "Authorization"
auth_scheme = "Bearer"
schedule = "daily"
max_response_bytes = 4194304

[source.mapping]
items_path = "data"
id_path = "id"
name_path = "id"
created_path = "created"

# First-party documented estimator and sampler classes (no trained releases).
[[source]]
name = "lightgbm-python-estimators"
adapter = "html_catalog"
enabled = true
entry_tags = ["ecosystem:lightgbm", "kind:machine-learning-component"]
