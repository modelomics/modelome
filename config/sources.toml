[[source]]
name = "aws-bedrock-model-cards"
adapter = "html_catalog"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:aws-bedrock", "kind:model-documentation"]
url = "https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards.html"
provider_namespace = "aws:bedrock-model-card"
artifact_kind = "model_card"
model_status = "documented"
schedule = "daily"
max_response_bytes = 4194304
max_entries = 2000

[[source.rules]]
kind = "link"
href_pattern = '^https://docs\.aws\.amazon\.com/bedrock/latest/userguide/model-card-[a-z0-9][a-z0-9-]*\.html$'
identity_source = "url"
identity_pattern = '^https://docs\.aws\.amazon\.com/bedrock/latest/userguide/model-card-(?P<id>[a-z0-9][a-z0-9-]*)\.html$'
relation = "model_card"
require_url = true

# SageMaker JumpStart's public inventory is a dated model catalog rather than an
