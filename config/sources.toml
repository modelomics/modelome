# Software Heritage supplies a no-keyword historical origin plane, including
# inactive repositories absent from recent GitHub activity. The current official
# full-graph release list and export metadata approve a settled ORC origin snapshot;
# every origin row lands before exact GitHub URLs are projected to the frontier.
# The origin slice is large (hundreds of millions of rows), so bounded shards are
# expected to take many daily passes. It is still a snapshot of archived holdings,
# not proof that every public repository is present or that deleted content is readable.
[[source]]
name = "software-heritage-origins"
adapter = "software_heritage_origins"
enabled = true
bucket_url = "https://softwareheritage.s3.amazonaws.com/"
graph_prefix = "graph/"
release_list_url = "https://docs.softwareheritage.org/_sources/devel/swh-export/graph/dataset.rst.txt"
schedule = "daily"
page_size = 32
list_page_size = 1000
settlement_age_hours = 168

