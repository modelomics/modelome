# PyTorch Hub is a curated, first-party index of research-ready model pages.
# Each card links to a reproducible Hub page; this source preserves that page's
# opaque slug as a source-native identity rather than inferring equivalence with
# a TorchVision builder, a GitHub repository, or a model's original paper.
[[source]]
name = "pytorch-hub-model-pages"
adapter = "html_catalog"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:pytorch-hub", "kind:model-documentation"]
url = "https://pytorch.org/hub/"
provider_namespace = "pytorch:hub-model-page"
artifact_kind = "model_card"
model_status = "documented"
allowed_origins = ["https://pytorch.org", "https://arxiv.org", "https://github.com", "https://colab.research.google.com", "https://huggingface.co", "https://download.pytorch.org"]
schedule = "weekly"
max_response_bytes = 4194304
max_entries = 1000
detail_batch_size = 10

[[source.rules]]
kind = "link"
href_pattern = '^https://pytorch\.org/hub/[a-z0-9][a-z0-9_-]*$'
identity_source = "url"
identity_pattern = '^https://pytorch\.org/hub/(?P<id>[a-z0-9][a-z0-9_-]*)$'
relation = "model_card"
require_url = true

# A Hub card's content region can directly declare a paper, exact GitHub source
# path, Colab notebook, Hugging Face Space demo, or PyTorch checkpoint. These
# path-specific selectors exclude repository, social, and site navigation links
# that appear in the shared page chrome.
[[source.detail_resource_rules]]
href_pattern = '^https://arxiv\.org/(?:abs|pdf)/[0-9]{4}\.[0-9]{4,5}(?:v[0-9]+)?(?:\.pdf)?$'
relation = "paper_reference"

[[source.detail_resource_rules]]
href_pattern = '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/(?:blob|tree)/[A-Za-z0-9._/-]+$'
relation = "official_implementation"

[[source.detail_resource_rules]]
href_pattern = '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases/download/[A-Za-z0-9._.-]+/[^?#]+$'
relation = "weights"
crawl = false

[[source.detail_resource_rules]]
href_pattern = '^https://download\.pytorch\.org/models/[A-Za-z0-9._/-]+$'
relation = "weights"
crawl = false

[[source.detail_resource_rules]]
href_pattern = '^https://colab\.research\.google\.com/github/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/blob/[A-Za-z0-9._/-]+\.ipynb$'
relation = "demo"

[[source.detail_resource_rules]]
href_pattern = '^https://huggingface\.co/spaces/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
relation = "demo"

