# Disabled proposal: Dryad provides a public phrase search and paginated file
# metadata. This candidate source only returns explicit model-weight evidence.
[[source]]
name = "dryad-model-weight-candidates"
adapter = "dryad_model_candidates"
enabled = false
base_url = "https://datadryad.org/api/v2"
query = '"weights of the trained machine learning models"'
page_size = 1
max_pages = 3
entry_tags = ["provider:dryad", "kind:model-artifact-candidate"]
schedule = "manual"
max_response_bytes = 8388608

# This proposal searches one exact phrase found in Dryad metadata for a verified record
# that lists trained machine-learning model weights. It inspects at most three result
# records per run, one at a time, and emits a candidate only when dataset context and
# file-level weight evidence agree. File pages are followed sequentially and bounded;
# no file bytes are fetched. Dryad documents API accounts as receiving eight times the
# anonymous request rate but does not publish the anonymous numeric quota in its API
# guide. Keep this source manual and stop/resume later on HTTP 429.
