# Disabled proposal: Dryad provides a public phrase search and paginated file
# metadata. This candidate source only returns explicit model-weight evidence.
[[source]]
name = "dryad-model-weight-candidates"
adapter = "dryad_model_candidates"
enabled = false
base_url = "https://datadryad.org/api/v2"
dataset_doi = "10.5061/dryad.ns1rn8ptd"
page_size = 1
entry_tags = ["provider:dryad", "kind:model-artifact-candidate"]
schedule = "manual"
max_response_bytes = 8388608

# This proposal uses the exact record DOI rather than broad phrase search. It emits a
# candidate only when the record metadata describes trained machine-learning models and
# file metadata has an explicit weight/checkpoint filename or model-weight description.
# File pages are followed sequentially and bounded; no file bytes are fetched. Dryad documents API accounts as
# receiving eight times the anonymous request rate, but does not publish the anonymous
# numeric quota in its API guide. Keep this source manual and stop/resume later on HTTP 429.
