# fairseq's first-party README model tables expose released RoBERTa, BART,
# XLM-R, mBART, and transformer-LM checkpoints as direct archives on
# dl.fbaipublicfiles.com. Keep each model family independently identified and
# disabled until the dedicated fixed-document adapter is wired into catalog.py.
[[source]]
name = "fairseq-roberta-model-zoo"
adapter = "fairseq_pretrained_language_models"
enabled = false
entry_tags = [
  "field:natural-language-processing",
  "model-family:roberta",
  "ecosystem:fairseq",
  "kind:checkpoint",
]
document_path = "examples/roberta/README.md"
schedule = "weekly"
max_response_bytes = 8388608
max_rows = 10000

