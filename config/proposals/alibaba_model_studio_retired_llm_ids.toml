# Alibaba Cloud's Model Studio rate-limit documentation lists these exact API
# model IDs under its July 30, 2025 retired-model batch.
[[source]]
name = "alibaba-model-studio-retired-llm-2025-07-30"
adapter = "html_catalog"
enabled = false
entry_tags = ["field:machine-learning", "ecosystem:alibaba-model-studio", "kind:model-lifecycle-documentation", "evidence:provider-lifecycle-history", "lifecycle:retired", "retired-on:2025-07-30"]
url = "https://help.aliyun.com/zh/model-studio/rate-limit"
provider_namespace = "alibaba:model-studio-model"
artifact_kind = "catalog_record"
model_status = "documented"
schedule = "weekly"
max_response_bytes = 8388608
max_entries = 100

[[source.rules]]
kind = "text"
entry_pattern = '\b(?P<name>qwen-vl-plus-2023-12-01|yi-large-rag|yi-large-turbo|yi-large|yi-medium|dolly-12b-v2)\b'
identity_source = "name"
require_url = false
