# DeepInfra's public /models page carries a complete first-party model list in
# its server-rendered Next.js payload at props.pageProps.models. The public UI
# paginates this catalog across /models/2, /models/3, etc.; the payload already
# contains the entire catalog, so this adapter reads the root page once. It
# records exact serving IDs as documented provider endpoints only, including
# retired/deprecated catalog rows, and does not claim downloadable weights.
[[source]]
name = "deepinfra-model-catalog"
adapter = "deepinfra_model_catalog"
enabled = false
entry_tags = ["ecosystem:deepinfra", "kind:hosted-model-endpoint"]
url = "https://deepinfra.com/models"
provider_namespace = "deepinfra:model"
schedule = "daily"
max_response_bytes = 8388608
max_script_chars = 8388608
max_entries = 10000
