# FAIR's archived Bio-LM README lists nine models with official Transformers
# and fairseq archives. The adapter records direct archives, not their members.
[[source]]
name = "facebook-bio-lm-first-party-archives"
adapter = "biolm_registry"
enabled = false
entry_tags = ["field:biomedical-nlp", "ecosystem:facebook-bio-lm", "kind:pretrained-weights"]
repository = "facebookresearch/bio-lm"
branch = "main"
source_path = "README.md"
max_response_bytes = 2097152
max_entries = 100

[evidence]
model_table = "https://github.com/facebookresearch/bio-lm/blob/main/README.md"
archive_host = "https://dl.fbaipublicfiles.com/biolm/"
scope = "All named model rows and their direct Transformers/fairseq tar.gz archive URLs"
