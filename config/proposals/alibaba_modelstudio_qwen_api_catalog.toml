# Alibaba Cloud Model Studio's public rate-limit tables enumerate exact API
# model IDs across Qwen model types, including dated snapshots and aliases.
[[source]]
name = "alibaba-model-studio-qwen-api-model-documentation"
adapter = "html_catalog"
enabled = false
entry_tags = ["field:machine-learning", "ecosystem:alibaba-model-studio", "ecosystem:qwen", "kind:hosted-model", "evidence:provider-model-documentation"]
url = "https://help.aliyun.com/en/model-studio/rate-limit"
provider_namespace = "alibaba:model-studio-model"
artifact_kind = "catalog_record"
model_status = "documented"
schedule = "weekly"
max_response_bytes = 8388608
max_entries = 2000

[[source.rules]]
kind = "text"
entry_pattern = '''\b(?!qwen(?:work[.]cn|-(?:language-model(?:-open-source-version)?|open-source))\b)(?P<name>(?:qwen|qwq|qvq)[a-z0-9.-]*[a-z0-9])\b'''
identity_source = "name"
require_url = false
