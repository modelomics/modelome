# NASA-IMPACT's first-party Prithvi-EO-2.0 README names released model variants
# and their declared model repository destinations. The adapter retains those
# destinations as model_repository links, without claiming direct binary URLs.
[[source]]
name = "nasa-prithvi-geospatial-registry"
adapter = "geospatial_registry"
enabled = true
entry_tags = ["field:geospatial-machine-learning", "ecosystem:nasa-prithvi", "kind:pretrained-model"]
repository = "NASA-IMPACT/Prithvi-EO-2.0"
branch = "main"
source_path = "README.md"
provider_namespace = "nasa-prithvi:model"
max_response_bytes = 4194304
max_entries = 100

[evidence]
model_table = "https://github.com/NASA-IMPACT/Prithvi-EO-2.0"
