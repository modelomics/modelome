# Cohere's archived 2022 release notes identify exact dated API model IDs and
# document their retirement/routing date. These historical snapshots are not
# covered by the active model overview or Rerank-only lifecycle source.
[[source]]
name = "cohere-legacy-snapshots-retired-2022-12-02-sizing-update"
adapter = "html_catalog"
enabled = false
entry_tags = ["field:machine-learning", "ecosystem:cohere", "kind:model-lifecycle-documentation", "evidence:provider-lifecycle-history", "lifecycle:retired", "retired-on:2022-12-02"]
url = "https://docs.cohere.com/v1/changelog/model-sizing-update-improvements"
provider_namespace = "cohere:model"
artifact_kind = "catalog_record"
model_status = "documented"
schedule = "monthly"
max_response_bytes = 4194304
max_entries = 100

[[source.rules]]
kind = "text"
entry_pattern = '\b(?P<name>large-20220926|small-20220926)\b'
identity_source = "name"
require_url = false

