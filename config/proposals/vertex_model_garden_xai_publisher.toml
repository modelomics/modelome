# Opt-in catalog of xAI publisher models managed by Vertex AI Model Garden.
# The request is scoped to the public `publishers/xai` publisher, not
# project-owned tuned models or deployed endpoints. `listAllVersions` exposes
# PublisherModel versions; the adapter retains exact version identity as
# name@versionId. This covers Google-hosted Grok offerings, not xAI's full API.
# References:
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/rest/v1beta1/publishers.models/list
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/rest/v1beta1/publishers.models
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/grok/grok-4-6
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/grok/capabilities/function-calling
[[source]]
name = "vertex-model-garden-xai-publisher"
adapter = "json_catalog"
enabled = false
activation_env = "VERTEX_AI_ACCESS_TOKEN"
entry_tags = ["field:machine-learning", "ecosystem:xai", "ecosystem:google-vertex-ai", "kind:hosted-model-offering", "evidence:provider-catalog"]
url = "https://us-central1-aiplatform.googleapis.com/v1beta1/publishers/xai/models?listAllVersions=true"
provider_namespace = "google:vertex-model-garden"
model_card_url_template = "https://us-central1-aiplatform.googleapis.com/v1beta1/{id_path}"
model_page_crawl = false
model_status = "documented"
auth_env = "VERTEX_AI_ACCESS_TOKEN"
auth_header = "Authorization"
auth_scheme = "Bearer"
headers = { "x-goog-user-project" = "${GOOGLE_CLOUD_PROJECT}" }
cursor_param = "pageToken"
page_size = 100
page_size_param = "pageSize"
schedule = "daily"
max_response_bytes = 8388608

[source.mapping]
items_path = "publisherModels"
id_path = "name"
name_path = "name"
version_path = "versionId"
release_id_template = "{id}@{version}"
next_cursor_path = "nextPageToken"
