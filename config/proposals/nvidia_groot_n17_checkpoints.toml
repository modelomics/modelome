[[source]]
name = "nvidia-groot-n17-checkpoints"
adapter = "nvidia_groot_n17_checkpoints"
enabled = false
entry_tags = ["field:robotics", "ecosystem:nvidia-isaac-groot", "kind:pretrained-policy"]
