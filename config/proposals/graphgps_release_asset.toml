# GraphGPS documents one pretrained GPS-deep archive for the OGB-LSC leaderboard.
# The direct Dropbox URL is in a fenced wget command in the first-party README.
# This remains disabled until the source factory dispatch is added.
[[source]]
name = "graphgps-ogblsc-pretrained-asset"
adapter = "graphgps_release_asset"
enabled = false
entry_tags = ["field:graph-machine-learning", "field:computational-chemistry", "ecosystem:graphgps", "model-family:gps-transformer", "kind:checkpoint"]
repository = "rampasek/GraphGPS"
branch = "main"
document_path = "README.md"
provider_namespace = "graphgps:checkpoint"
schedule = "weekly"
max_response_bytes = 4194304
max_entries = 10000
