# First-party hosted-model lists. These authenticated endpoints report models
# currently available through the API, so observations are credential-scoped
# availability evidence rather than a public historical census. Credential
# variables gate each source, and API-backed model pages are never crawled.

[[source]]
name = "together-models"
adapter = "json_catalog"
enabled = true
activation_env = "TOGETHER_API_KEY"
entry_tags = ["field:machine-learning", "ecosystem:together", "kind:hosted-model", "evidence:current-api-availability"]
url = "https://api.together.ai/v1/models"
provider_namespace = "together:model"
model_card_url_template = "https://www.together.ai/models/{id_path}"
model_page_crawl = false
auth_env = "TOGETHER_API_KEY"
auth_header = "Authorization"
auth_scheme = "Bearer"
schedule = "daily"
max_response_bytes = 16777216

[source.mapping]
items_path = "$"
id_path = "id"
name_path = "display_name"
created_path = "created"

