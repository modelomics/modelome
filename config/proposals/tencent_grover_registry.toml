# The first-party GROVER README gives literal BASE/LARGE tarball URLs for each
# fine-tuning dataset. This disabled proposal excludes cloud-drive pretraining links.
[[source]]
name = "tencent-grover-finetuned-checkpoints"
adapter = "grover_checkpoint_registry"
enabled = false
entry_tags = ["field:graph-machine-learning", "field:computational-chemistry", "ecosystem:tencent-grover", "task:molecular-property-prediction", "kind:checkpoint"]
repository = "tencent-ailab/grover"
branch = "main"
source_path = "README.md"
provider_namespace = "tencent-grover:finetuned-checkpoint"
schedule = "weekly"
max_response_bytes = 4194304
max_entries = 100
