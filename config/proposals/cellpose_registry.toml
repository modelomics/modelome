# Proposed bounded source for Cellpose's own named website checkpoints and
# learned size-model files. The official docs give a finite set of names and
# the /models/MODEL_NAME download template. Cellpose 4 built-ins are proposed
# separately in cellpose_hf_checkpoints.toml.
[[source]]
name = "cellpose-website-checkpoints"
adapter = "cellpose_registry"
enabled = false
entry_tags = ["field:computer-vision", "subfield:bioimage-analysis", "ecosystem:cellpose", "kind:checkpoint"]
model_url_base = "https://www.cellpose.org/models"
schedule = "weekly"

[evidence]
cellpose_v3_model_guide = "https://cellpose.readthedocs.io/en/v3.1.1.1/models.html"
cellpose_current_models_module = "https://cellpose.readthedocs.io/en/v3.1.1.1/_modules/cellpose/models.html"
cellpose_legacy_ensemble_guide = "https://cellpose.readthedocs.io/en/stable/models.html"
cellpose_restore_guide = "https://cellpose.readthedocs.io/en/latest/restore.html"
