# Disabled proposal: Microsoft Foundry publishes a public, first-party model
# retirement schedule. Its rows include exact documented model names, versions,
# lifecycle stages, retirement dates, and replacements. The generic HTML catalog
# keeps each full row in occurrence evidence; repeated model names therefore
# retain multiple documented versions/lifecycle rows under one family record.
#
# This is a lifecycle-documentation plane, not a live deployment inventory. The
# portal's lifecycle-status API is subscription/region scoped and is not used.
# Primary source: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule
[[source]]
name = "azure-foundry-model-lifecycle"
adapter = "html_catalog"
enabled = false
entry_tags = ["field:machine-learning", "ecosystem:azure-foundry", "kind:model-lifecycle-documentation"]
url = "https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule"
provider_namespace = "azure:foundry-model-lifecycle"
artifact_kind = "catalog_record"
model_status = "documented"
schedule = "daily"
max_response_bytes = 8388608
max_entries = 5000

[[source.rules]]
kind = "table"
header_pattern = '^Model \| Version \| Lifecycle \| Retirement date \| Replacement$'
name_column = 0
identity_source = "name"
require_url = false

# Anthropic's public deprecation page contains exact API model names for current
# and recently retired versions and retains earlier retirement/replacement rows
# in its history section. This supplements the credentialed current-model API
# without querying or recording any account data.
# Primary source: https://platform.claude.com/docs/en/about-claude/model-deprecations
[[source]]
name = "anthropic-model-lifecycle-documentation"
adapter = "html_catalog"
enabled = false
entry_tags = ["field:machine-learning", "ecosystem:anthropic", "kind:model-lifecycle-documentation"]
url = "https://platform.claude.com/docs/en/about-claude/model-deprecations"
provider_namespace = "anthropic:model-lifecycle"
artifact_kind = "catalog_record"
model_status = "documented"
schedule = "daily"
max_response_bytes = 8388608
max_entries = 5000

[[source.rules]]
kind = "table"
header_pattern = '^API model name \| Current state \| Deprecated \| Tentative retirement date$'
name_column = 0
identity_source = "name"
require_url = false

[[source.rules]]
kind = "table"
header_pattern = '^Retirement date \| Deprecated model \| Recommended replacement$'
name_column = 1
identity_source = "name"
require_url = false
