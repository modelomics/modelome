# DGL-LifeSci publishes pretrained graph model checkpoint paths in a literal
# first-party Python dictionary. The adapter resolves those relative paths under
# DGL's documented data host and does not import the library or fetch weights.
[[source]]
name = "dgllife-pretrained-graph-checkpoints"
adapter = "graph_ml_registry"
enabled = true
entry_tags = ["field:graph-machine-learning", "field:computational-chemistry", "ecosystem:dgl-lifesci", "kind:checkpoint"]
repository = "awslabs/dgl-lifesci"
branch = "master"
source_path = "python/dgllife/model/pretrain/property_prediction.py"
mapping_variable = "property_url"
provider_namespace = "dgllife:checkpoint"
checkpoint_base_url = "https://data.dgl.ai/"
schedule = "weekly"
max_response_bytes = 4194304
max_entries = 10000
