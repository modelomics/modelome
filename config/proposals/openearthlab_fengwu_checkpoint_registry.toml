# OpenEarthLab's first-party FengWu README maps two model versions to exact
# OneDrive share-page URLs. The adapter does not resolve or download those files.
[[source]]
name = "openearthlab-fengwu-checkpoint-registry"
adapter = "fengwu_checkpoint_registry"
enabled = false
entry_tags = ["field:weather-machine-learning", "ecosystem:openearthlab-fengwu", "kind:pretrained-checkpoint"]
repository = "OpenEarthLab/FengWu"
branch = "main"
source_path = "README.md"
provider_namespace = "fengwu:checkpoint"
max_response_bytes = 4194304
max_entries = 10

[evidence]
trained_model_links = "https://github.com/OpenEarthLab/FengWu/blob/main/README.md"
checkpoint_restriction = "OneDrive share pages only; URLs are not resolved or downloaded"
