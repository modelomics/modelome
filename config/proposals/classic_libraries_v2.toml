# Additional live-documented technique catalogs. These identities are API
# techniques/components, not software releases.

[[source]]
name = "xgboost-python-estimators"
adapter = "html_catalog"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:xgboost", "kind:machine-learning-component"]
url = "https://xgboost.readthedocs.io/en/stable/python/python_api.html"
provider_namespace = "xgboost:machine-learning-component"
artifact_kind = "catalog_record"
model_status = "documented"
schedule = "weekly"
max_response_bytes = 16777216
max_entries = 5000
[[source.rules]]
kind = "link"
href_pattern = '^https://xgboost\.readthedocs\.io/en/stable/python/python_api\.html$'
raw_href_pattern = '#xgboost\.(?:XGBClassifier|XGBRegressor|XGBRanker|XGBRFClassifier|XGBRFRegressor)$'
identity_source = "href"
identity_pattern = '#xgboost\.(?P<id>XGB(?:RF)?(?:Classifier|Regressor)|XGBRanker)$'
relation = "model_page"
require_url = true

