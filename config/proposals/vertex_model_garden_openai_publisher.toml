# Opt-in catalog of OpenAI publisher models in Vertex AI Model Garden. This is
# the publisher-scoped API listing, not project-owned tuned models or deployed
# endpoints. Versions are returned with immutable IDs and mapped to exact
# name@versionId resource IDs. Coverage is limited to Google-hosted offerings,
# not OpenAI's complete model catalog.
# References:
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/rest/v1beta1/publishers.models/list
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/rest/v1beta1/publishers.models
# https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-create-remote-model-open
[[source]]
name = "vertex-model-garden-openai-publisher"
adapter = "json_catalog"
enabled = false
activation_env = "VERTEX_AI_ACCESS_TOKEN"
entry_tags = ["field:machine-learning", "ecosystem:openai", "ecosystem:google-vertex-ai", "kind:model-garden-offering", "evidence:provider-catalog"]
url = "https://us-central1-aiplatform.googleapis.com/v1beta1/publishers/openai/models?listAllVersions=true"
provider_namespace = "google:vertex-model-garden"
model_card_url_template = "https://us-central1-aiplatform.googleapis.com/v1beta1/{id_path}"
model_page_crawl = false
model_status = "documented"
auth_env = "VERTEX_AI_ACCESS_TOKEN"
auth_header = "Authorization"
auth_scheme = "Bearer"
headers = { "x-goog-user-project" = "${GOOGLE_CLOUD_PROJECT}" }
cursor_param = "pageToken"
page_size = 100
page_size_param = "pageSize"
schedule = "daily"
max_response_bytes = 8388608

[source.mapping]
items_path = "publisherModels"
id_path = "name"
name_path = "name"
version_path = "versionId"
release_id_template = "{id}@{version}"
next_cursor_path = "nextPageToken"
