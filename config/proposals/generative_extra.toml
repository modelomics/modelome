# First-party CompVis latent-diffusion model bundles. This source is disabled
# until the adapter is registered in the source catalog.
[[source]]
name = "compvis-latent-diffusion-downloads"
adapter = "compvis_latent_diffusion_downloads"
enabled = false
entry_tags = ["field:generative-image-modeling", "ecosystem:compvis", "kind:checkpoint-bundle"]
repository = "CompVis/latent-diffusion"
branch = "main"
source_path = "scripts/download_models.sh"
provider_namespace = "compvis:latent-diffusion"
max_response_bytes = 4194304
max_entries = 10000
schedule = "weekly"
