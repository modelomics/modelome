# Additional first-party ONNX Model Zoo inventory. The original ONNX README
# directs users to the Hugging Face `onnxmodelzoo` organization for continued
# access. The public organization gallery currently reports 2,326 models.
# The dedicated adapter follows the owner-scoped Hub cursor and links declared
# ONNX files without transferring their bytes. This proposal is inactive until
# the source factory registers `onnx_model_zoo_hub`.
[[source]]
name = "onnx-model-zoo-hub"
adapter = "onnx_model_zoo_hub"
enabled = true
entry_tags = ["field:machine-learning", "ecosystem:onnx", "ecosystem:huggingface", "kind:pretrained-model"]
url = "https://huggingface.co/api/models?author=onnxmodelzoo"
page_size = 100
max_response_bytes = 16777216
max_entries = 5000
schedule = "weekly"
