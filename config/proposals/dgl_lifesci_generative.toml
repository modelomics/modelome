# DGL-LifeSci's generative checkpoint map declares five literal model handles
# and relative artifact paths. DGL's own downloader resolves these against
# https://data.dgl.ai/; the source remains disabled pending adapter dispatch.
[[source]]
name = "dgllife-generative-checkpoints"
adapter = "dgl_lifesci_checkpoint_registry"
enabled = false
entry_tags = ["field:graph-machine-learning", "field:computational-chemistry", "ecosystem:dgl-lifesci", "task:molecular-generation", "kind:checkpoint"]
repository = "awslabs/dgl-lifesci"
branch = "master"
source_path = "python/dgllife/model/pretrain/generative_models.py"
mapping_variable = "generative_url"
provider_namespace = "dgllife:generative-checkpoint"
checkpoint_base_url = "https://data.dgl.ai/"
schedule = "weekly"
max_response_bytes = 4194304
max_entries = 10000
