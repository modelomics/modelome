# Opt-in, caller-authenticated inventory of Anthropic publisher offerings in
# Vertex AI Model Garden. The list method is scoped to `publishers/anthropic`,
# rather than project-owned tuned models or deployed endpoints. `listAllVersions`
# returns version rows with immutable versionId values; the generic JSON adapter
# combines each name and versionId as the exact `name@versionId` release ID.
# This is Google-hosted availability metadata, not Anthropic's complete catalog.
# Primary references:
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/rest/v1beta1/publishers.models/list
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/rest/v1beta1/publishers.models
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/claude/sonnet-4-5
[[source]]
name = "vertex-model-garden-anthropic-publisher"
adapter = "json_catalog"
enabled = false
activation_env = "VERTEX_AI_ACCESS_TOKEN"
entry_tags = ["field:machine-learning", "ecosystem:anthropic", "ecosystem:google-vertex-ai", "kind:hosted-model-offering", "evidence:provider-catalog"]
url = "https://us-central1-aiplatform.googleapis.com/v1beta1/publishers/anthropic/models?listAllVersions=true"
provider_namespace = "google:vertex-model-garden"
model_card_url_template = "https://us-central1-aiplatform.googleapis.com/v1beta1/{id_path}"
model_page_crawl = false
model_status = "documented"
auth_env = "VERTEX_AI_ACCESS_TOKEN"
auth_header = "Authorization"
auth_scheme = "Bearer"
headers = { "x-goog-user-project" = "${GOOGLE_CLOUD_PROJECT}" }
cursor_param = "pageToken"
page_size = 100
page_size_param = "pageSize"
schedule = "daily"
max_response_bytes = 8388608

[source.mapping]
items_path = "publisherModels"
id_path = "name"
name_path = "name"
version_path = "versionId"
release_id_template = "{id}@{version}"
next_cursor_path = "nextPageToken"
