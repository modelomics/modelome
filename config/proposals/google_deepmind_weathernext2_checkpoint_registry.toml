# Expands only the six finite filename patterns in the first-party README into
# 18 declared object paths under the bucket/prefix used by its demo. This source
# does not list the bucket or fetch checkpoint files.
[[source]]
name = "google-deepmind-weathernext2-checkpoint-registry"
adapter = "weathernext2_checkpoint_registry"
enabled = false
entry_tags = ["field:weather-machine-learning", "ecosystem:google-deepmind-weathernext", "kind:pretrained-checkpoint"]
repository = "google-deepmind/weathernext"
branch = "main"
source_path = "README.md"
provider_namespace = "weathernext2:checkpoint"
max_response_bytes = 4194304
max_entries = 18

[evidence]
model_inventory = "https://github.com/google-deepmind/weathernext/blob/main/README.md"
bucket_prefix = "https://storage.googleapis.com/dm_graphcast/weathernext2/params/"
known_object_access = "Official demo uses an anonymous GCS client for known model and data paths"
listing = "No bucket listing or object existence assertion"
