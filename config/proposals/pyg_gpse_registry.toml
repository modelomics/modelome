# PyG's GPSE class contains five source-native dataset checkpoint IDs, each
# mapped to a direct Zenodo .pt URL. This source is proposed but disabled until
# the adapter is wired into the source factory.
[[source]]
name = "pytorch-geometric-gpse-checkpoints"
adapter = "pyg_gpse_registry"
enabled = false
entry_tags = ["field:graph-machine-learning", "field:computational-chemistry", "ecosystem:pytorch-geometric", "model-family:gpse", "kind:checkpoint"]
repository = "pyg-team/pytorch_geometric"
branch = "master"
source_path = "torch_geometric/nn/models/gpse.py"
provider_namespace = "pytorch-geometric:gpse-checkpoint"
schedule = "weekly"
max_response_bytes = 4194304
max_entries = 10000
