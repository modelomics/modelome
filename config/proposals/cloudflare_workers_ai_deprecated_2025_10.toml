# Cloudflare's Workers AI changelog names these exact API model IDs for its
# October 1, 2025 deprecation batch. The notice does not state a shutdown.
[[source]]
name = "cloudflare-workers-ai-deprecated-2025-10-01"
adapter = "html_catalog"
enabled = false
entry_tags = ["field:machine-learning", "ecosystem:cloudflare-workers-ai", "kind:model-lifecycle-documentation", "evidence:provider-lifecycle-history", "lifecycle:deprecated", "deprecated-on:2025-10-01"]
url = "https://developers.cloudflare.com/workers-ai/changelog/"
provider_namespace = "cloudflare:workers-ai-model"
artifact_kind = "catalog_record"
model_status = "documented"
schedule = "weekly"
max_response_bytes = 8388608
max_entries = 100

