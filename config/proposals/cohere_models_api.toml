# Cohere's authenticated public List Models endpoint returns model names and
# `is_deprecated` flags, and paginates with `next_page_token`. The listing is
# scoped to the API key's available models, so treat it as availability evidence
# rather than a public historical census. Raw provider fields retain the
# documented deprecation flag.
# Primary source: https://docs.cohere.com/reference/list-models
[[source]]
name = "cohere-models-api"
adapter = "json_catalog"
enabled = false
activation_env = "COHERE_API_KEY"
entry_tags = ["field:machine-learning", "ecosystem:cohere", "kind:hosted-model", "evidence:current-api-availability"]
url = "https://api.cohere.com/v1/models"
provider_namespace = "cohere:model"
model_card_url_template = "https://docs.cohere.com/docs/models"
model_page_crawl = false
auth_env = "COHERE_API_KEY"
auth_header = "Authorization"
auth_scheme = "Bearer"
cursor_param = "page_token"
page_size = 1000
page_size_param = "page_size"
schedule = "daily"
max_response_bytes = 8388608

[source.mapping]
items_path = "models"
id_path = "name"
name_path = "name"
next_cursor_path = "next_page_token"
