# Mistral's first-party models page retains a table of deprecated and retired
# models with exact API identifiers and version labels. The table is lifecycle
# history, not a current availability inventory.
# Primary source: https://docs.mistral.ai/models
[[source]]
name = "mistral-model-lifecycle-documentation"
adapter = "html_catalog"
enabled = false
entry_tags = ["field:machine-learning", "ecosystem:mistral", "kind:model-lifecycle-documentation", "evidence:provider-lifecycle-history"]
url = "https://docs.mistral.ai/models"
provider_namespace = "mistral:model-lifecycle"
artifact_kind = "catalog_record"
model_status = "documented"
schedule = "daily"
max_response_bytes = 8388608
max_entries = 5000

[[source.rules]]
kind = "table"
header_pattern = '^Model \| Version \| API$'
name_column = 0
identity_source = "name"
require_url = false
