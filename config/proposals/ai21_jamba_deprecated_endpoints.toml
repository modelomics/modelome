# AI21's Jamba documentation publishes a finite table of exact deprecated API
# endpoints and dates. These are serving endpoint IDs, not checkpoint IDs.
[[source]]
name = "ai21-jamba-api-deprecations-2026-02-01"
adapter = "html_catalog"
enabled = false
entry_tags = ["field:machine-learning", "ecosystem:ai21", "kind:model-lifecycle-documentation", "evidence:provider-lifecycle-history", "lifecycle:deprecated", "deprecated-on:2026-02-01"]
