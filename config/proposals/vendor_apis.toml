# xAI's documented REST model list returns the models available to the
# authenticating API key. Keep this as an opt-in proposal: it is account-scoped
# availability evidence, not a public historical model census. Model IDs link
# to the provider's detail API, and credentialed model pages are never crawled.
[[source]]
name = "xai-models"
adapter = "json_catalog"
enabled = true
activation_env = "XAI_API_KEY"
entry_tags = ["field:machine-learning", "ecosystem:xai", "kind:hosted-model"]
url = "https://api.x.ai/v1/models"
provider_namespace = "xai:model"
model_card_url_template = "https://api.x.ai/v1/models/{id_path}"
model_page_crawl = false
auth_env = "XAI_API_KEY"
auth_header = "Authorization"
auth_scheme = "Bearer"
schedule = "daily"
max_response_bytes = 4194304

[source.mapping]
items_path = "data"
id_path = "id"
name_path = "id"
created_path = "created"
