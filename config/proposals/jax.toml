# Proposal for a bounded first-party JAX/Flax model source. Keep disabled until
# the jax_registry adapter is registered by the catalog loader.
[[source]]
name = "t5x-model-registry"
adapter = "jax_registry"
enabled = false
repository = "google-research/t5x"
branch = "main"
source_path = "docs/models.md"
max_response_bytes = 4194304
max_entries = 10000
schedule = "weekly"

# Primary source: https://github.com/google-research/t5x/blob/main/docs/models.md
# The document describes its pre-trained T5 models and explicitly lists Gin
# configuration and checkpoint locations. The adapter reads that document only.
