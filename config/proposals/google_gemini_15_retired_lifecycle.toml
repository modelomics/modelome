# Google's release notes identify these exact Gemini 1.5 API IDs as shut down
# on 2025-09-29. They are absent from the current Gemini deprecation table.
[[source]]
name = "google-gemini-retired-2025-09-29-gemini-15"
adapter = "html_catalog"
enabled = false
entry_tags = ["field:machine-learning", "ecosystem:google-gemini", "kind:model-lifecycle-documentation", "evidence:provider-lifecycle-history", "lifecycle:retired", "retired-on:2025-09-29"]
url = "https://ai.google.dev/gemini-api/docs/changelog"
provider_namespace = "google:gemini-api-model"
artifact_kind = "catalog_record"
model_status = "documented"
schedule = "weekly"
max_response_bytes = 8388608
max_entries = 100

[[source.rules]]
kind = "text"
entry_pattern = '\b(?P<name>gemini-1[.]5-(?:flash-8b|pro|flash))(?![A-Za-z0-9-])'
identity_source = "name"
require_url = false
