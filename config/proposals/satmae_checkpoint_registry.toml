# SatMAE's first-party README links eight named checkpoints to exact Zenodo
# files. These may overlap the generic Zenodo catalog; URLs are kept verbatim.
[[source]]
name = "sustainlab-satmae-checkpoint-registry"
adapter = "satmae_checkpoint_registry"
enabled = false
entry_tags = ["field:earth-observation", "ecosystem:sustainlab-satmae", "kind:pretrained-checkpoint"]
repository = "sustainlab-group/SatMAE"
branch = "main"
source_path = "README.md"
provider_namespace = "satmae:checkpoint"
max_response_bytes = 4194304
max_entries = 8

[evidence]
checkpoint_table = "https://github.com/sustainlab-group/SatMAE/blob/main/README.md"
checkpoint_links = "Eight direct Zenodo file URLs listed in first-party checkpoint tables"
artifact_identity = "Exact URLs retained; no claim of unique binary identity or non-overlap with Zenodo"
