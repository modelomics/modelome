# The FTW first-party README names four direct v1 GitHub release checkpoint
# URLs: FULL and CC-BY-only variants for 2- and 3-class segmentation.
[[source]]
name = "ftw-release-checkpoints"
adapter = "ftw_release_checkpoints"
enabled = false
entry_tags = ["field:geospatial-machine-learning", "ecosystem:fields-of-the-world", "kind:pretrained-checkpoint"]
schedule = "weekly"
max_response_bytes = 2097152

[evidence]
model_inventory = "https://github.com/terramira/ftw-baselines"
release = "https://github.com/fieldsoftheworld/ftw-baselines/releases/tag/v1"
checkpoint_scope = "Four README-declared v1 .ckpt assets; no release attachment bytes fetched"
