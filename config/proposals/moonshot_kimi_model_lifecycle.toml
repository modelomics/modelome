# Kimi's official model list groups exact IDs by lifecycle and states the
# discontinuation date for each group. Keep each date cohort as a source shard
# so provenance remains attached to its exact model IDs.

[[source]]
name = "moonshot-kimi-current-model-documentation"
adapter = "html_catalog"
enabled = false
entry_tags = ["field:machine-learning", "ecosystem:moonshot", "kind:model-lifecycle-documentation", "lifecycle:current"]
url = "https://platform.kimi.ai/docs/models"
provider_namespace = "moonshot:model"
artifact_kind = "catalog_record"
model_status = "documented"
schedule = "daily"
max_response_bytes = 4194304
max_entries = 1000

[[source.rules]]
kind = "table"
header_pattern = '^Model Name [|] Description$'
name_column = 0
identity_source = "name"
name_pattern = '^(?P<name>kimi-k3|kimi-k2[.]7-code(?:-highspeed)?|kimi-k2[.]6)$'
skip_nonmatching_names = true
require_url = false

