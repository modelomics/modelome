# Kimi's first-party model list documents exact current API IDs in one table,
# deprecated IDs in a second table, and two discontinued aliases in text. Keep
# this metadata-only source disabled until adopted into the active registry.
[[source]]
name = "moonshot-kimi-model-lifecycle-documentation"
adapter = "html_catalog"
enabled = false
entry_tags = ["field:machine-learning", "ecosystem:moonshot", "kind:model-lifecycle-documentation", "evidence:provider-lifecycle-history"]
url = "https://platform.kimi.ai/docs/models"
provider_namespace = "moonshot:model"
artifact_kind = "catalog_record"
model_status = "documented"
schedule = "daily"
max_response_bytes = 4194304
max_entries = 1000

[[source.rules]]
kind = "table"
header_pattern = '^Model Name \| Description$'
name_column = 0
identity_source = "name"
name_pattern = '^(?P<name>kimi-[a-z0-9.-]+|moonshot-v1-[a-z0-9.-]+)$'
skip_nonmatching_names = true
require_url = false

[[source.rules]]
kind = "text"
entry_pattern = '<code>(?P<name>kimi-latest|kimi-thinking-preview)</code>'
identity_source = "name"
require_url = false
