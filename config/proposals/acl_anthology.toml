# Bounded first-party ACL Anthology paper collection proposal.
# ACL's official data repository publishes authoritative per-collection XML.
# The 2025 ACL collection contains model-bearing NLP research plus proceedings
# and workshop metadata. This source is one collection file, capped at 16 MiB
# and 10,000 papers; unchanged file contents are skipped after the first sync.
[[source]]
name = "acl-anthology-2025-acl"
adapter = "acl_anthology"
enabled = false
url = "https://raw.githubusercontent.com/acl-org/acl-anthology/master/data/xml/2025.acl.xml"
max_response_bytes = 16777216
max_papers = 10000
max_abstract_chars = 100000
schedule = "weekly"
