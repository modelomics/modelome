# OpenAI RL Clarity explicitly indexes model handles and documents each primary
# checkpoint as the matching relative model path with a .jd suffix. Keep disabled
# until the catalog owner reviews and registers this bounded source.
[[source]]
name = "openai-rl-clarity-checkpoints"
adapter = "rl_clarity_checkpoint_index"
enabled = false
entry_tags = ["field:reinforcement-learning", "ecosystem:openai-rl-clarity", "kind:pretrained-policy"]
schedule = "weekly"
max_response_bytes = 2097152
max_entries = 100

[evidence]
checkpoint_index = "https://openaipublic.blob.core.windows.net/rl-clarity/attribution/models/index.html"
project_readme = "https://github.com/openai/understanding-rl-vision"
