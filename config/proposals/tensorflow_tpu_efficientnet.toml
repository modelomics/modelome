# TensorFlow TPU's official EfficientNet README publishes exact checkpoint links
# in a transposed method-by-variant table. The adapter only reads that matrix.
[[source]]
name = "tensorflow-tpu-efficientnet-checkpoints"
adapter = "tensorflow_tpu_efficientnet"
enabled = false
entry_tags = ["field:computer-vision", "ecosystem:tensorflow-tpu", "kind:pretrained-checkpoint"]
repository = "tensorflow/tpu"
branch = "master"
document_path = "models/official/efficientnet/README.md"
schedule = "weekly"
max_response_bytes = 4194304
max_entries = 500
