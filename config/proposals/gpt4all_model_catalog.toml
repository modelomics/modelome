# Disabled proposal. GPT4All's official Python `list_models()` helper reads
# this same first-party desktop/Python JSON manifest. The dedicated adapter
# records exact GPT4All-hosted GGUF/BIN filenames, checksums, app compatibility,
# and declared download URLs as non-crawled artifact references. Rows hosted by
# Hugging Face are excluded as already covered by hub catalogs. It never
# downloads weights.
#
# Primary sources:
# https://docs.gpt4all.io/gpt4all_python/ref.html
# https://github.com/nomic-ai/gpt4all/blob/main/gpt4all-chat/metadata/models3.json
# Adapter implementation is intentionally not registered in the shared source
# loader; review and registration are separate from this disabled proposal.
[[source]]
name = "gpt4all-model-catalog"
adapter = "gpt4all_model_catalog"
enabled = false
entry_tags = ["field:machine-learning", "ecosystem:gpt4all", "kind:local-model-artifact"]
repository = "nomic-ai/gpt4all"
branch = "main"
source_path = "gpt4all-chat/metadata/models3.json"
schedule = "daily"
max_response_bytes = 4194304
max_entries = 10000
