# The first-party Zatom README currently documents 24 individual checkpoint
# commands pointing to exact files in one public Zenodo record.
[[source]]
name = "zatom-checkpoints"
adapter = "zatom_checkpoint_registry"
enabled = false
repository = "Zatom-AI/zatom"
branch = "main"
source_path = "README.md"
zenodo_record = "19766997"
entry_tags = ["field:computational-chemistry", "ecosystem:zatom", "model-family:zatom-1", "kind:checkpoint"]
schedule = "weekly"
max_response_bytes = 2097152
max_entries = 100

# Coverage follows only literal .ckpt wget commands in the README's bounded
# Checkpoints section. It excludes result archives and does not fetch weights.
